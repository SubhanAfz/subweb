services:
  subweb:
    image: subhanafz/subweb:latest
    volumes:
    - ./instance:/app/instance
    - ./static/download_files:/app/static/download_files
    expose:
    - "8000"
    command: gunicorn -w 4 -b 0.0.0.0:8000 main:app
    restart: "always"
    env_file:
      - .env
  caddy:
    build: ./caddy
    image: local/caddy-cloudflare:2.11.7
    restart: unless-stopped
    env_file:
      - ./caddy/cloudflare.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - subweb
    networks:
      default:
        # Preserve the existing FRP destination during the nginx migration.
        aliases:
          - subweb-nginx-1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
